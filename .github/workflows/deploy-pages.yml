name: Deploy to GitHub Pages

# 대시보드 화면(index.html)과 데이터(data/)만 공개한다. 소스·DB는 배포하지 않는다.
on:
  push:
    branches: [main]
    paths: ['index.html', 'data/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 업로드와 배포를 별도 잡으로 분리 (GitHub 공식 패턴).
  # 같은 잡에서 업로드 직후 배포하면 아티팩트 목록 반영이 늦어
  # 'Found 0 artifact(s) / Fetching artifact metadata failed' 가 간헐적으로 발생했다.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 파이프라인이 방금 push한 데이터까지 포함
      - name: Build site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 재시도 대기
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
