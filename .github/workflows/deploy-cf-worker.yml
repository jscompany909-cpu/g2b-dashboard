name: Cloudflare Worker 배포

on:
  push:
    paths:
      - 'cloudflare-cron/**'   # Worker 코드 변경 시 자동 배포
  workflow_dispatch:            # 수동 배포 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy Worker to Cloudflare
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: cloudflare-cron
        command: deploy

    - name: Set GITHUB_TOKEN secret on Worker
      working-directory: cloudflare-cron
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" | npx wrangler secret put GITHUB_TOKEN
