name: G2B 통합 파이프라인 (수집 → 대시보드 → 메일)

# 1) 입찰공고(나라장터 API·KISA·NIPA·IITP) + 나라장터 사전규격 + 바우처·지원사업(기업마당·NIPA) 수집
# 2) data/*.json 갱신 → GitHub Pages 대시보드 배포
# 3) 대시보드 요약 메일 발송 (기본: 월요일만, 저장소 변수 MAIL_WEEKDAYS 로 변경 가능)

on:
  # 정시 실행은 Cloudflare Worker(cloudflare-cron/, 평일 08:00 KST)가 workflow_dispatch로 호출한다.
  # GitHub 예약은 수 시간 지연·누락이 잦아 백업으로만 둔다 — 그날 이미 실행됐으면 gate가 건너뛴다.
  schedule:
    - cron: '0 23 * * 0-4'   # 평일 08:00 KST (UTC 전날 23:00)
  workflow_dispatch:
    inputs:
      send_mail:
        description: '메일 발송: auto(요일 규칙) / true / false'
        required: false
        default: 'auto'

concurrency:
  group: g2b-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Seoul   # 러너는 UTC — 날짜 경계·updated_at을 KST로

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: 중복 실행 확인 (백업 예약 실행만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 오늘(KST) 0시 이후 workflow_dispatch 실행이 성공했거나 진행 중이면 건너뜀
          SINCE=$(date -u -d "$(date +%Y-%m-%d) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/pipeline.yml/runs?event=workflow_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$SINCE\") | select(.conclusion == \"success\" or .status != \"completed\")] | length")
          echo "since=$SINCE dispatch_runs_today=$N"
          if [ "$N" -gt 0 ]; then
            echo "오늘 이미 실행됨 (Worker) → 백업 예약 실행 건너뜀"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "오늘 실행 기록 없음 → 백업 예약 실행 진행"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04   # ubuntu-latest(26.04)는 Playwright 미지원
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      prespec: ${{ steps.prespec.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Create .env
        run: |
          echo "G2B_API_KEY=${{ secrets.G2B_API_KEY }}" > .env
          echo "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}" >> .env
          echo "AZURE_OPENAI_KEY=${{ secrets.AZURE_OPENAI_KEY }}" >> .env
          echo "AZURE_OPENAI_DEPLOYMENT=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" >> .env
          echo "AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION }}" >> .env

      - name: 입찰공고 수집 + AI 채점 (harness)
        run: python g2b_harness.py
        env:
          PYTHONIOENCODING: utf-8

      - name: PDF 사업금액 추출
        continue-on-error: true
        run: python g2b_pdf_budget.py --no-export
        env:
          PYTHONIOENCODING: utf-8

      - name: 입찰 JSON 내보내기
        run: python g2b_export_json.py --ci
        env:
          PYTHONIOENCODING: utf-8

      - name: 사전규격 수집 (나라장터)
        id: prespec
        continue-on-error: true
        run: python g2b_prespec.py --days 30
        env:
          PYTHONIOENCODING: utf-8

      - name: 바우처·지원사업 수집 (기업마당·NIPA·뉴스)
        id: voucher
        continue-on-error: true
        run: python g2b_voucher.py --days 7
        env:
          PYTHONIOENCODING: utf-8

      - name: Remove .env
        if: always()
        run: rm -f .env

      - name: Commit and push DB + JSON
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "정부과제_트렌드_창고.db" data/announcements.json data/prespec.json data/vouchers.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
            exit 0
          fi
          git commit -m "chore: 데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main

  deploy:
    needs: collect
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  mail:
    needs: [collect, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 발송 여부 판단
        id: gate
        run: |
          MODE="${{ github.event.inputs.send_mail || 'auto' }}"
          DAYS="${{ vars.MAIL_WEEKDAYS || '1' }}"     # 1=월 … 7=일, 쉼표 구분
          DOW=$(TZ=Asia/Seoul date +%u)
          if [ "$MODE" = "true" ]; then SEND=true
          elif [ "$MODE" = "false" ]; then SEND=false
          elif echo ",$DAYS," | grep -q ",$DOW,"; then SEND=true
          else SEND=false; fi
          echo "mode=$MODE dow=$DOW days=$DAYS → send=$SEND"
          echo "send=$SEND" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.send == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.send == 'true'
        with:
          python-version: '3.11'

      - name: 요약 메일 발송
        if: steps.gate.outputs.send == 'true'
        run: python g2b_email_notify.py
        env:
          PYTHONIOENCODING: utf-8
          PRESPEC_OUTCOME: ${{ needs.collect.outputs.prespec }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}

  alert:
    needs: [collect, deploy, mail]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 실패 알림 메일
        run: python g2b_email_notify.py --alert "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          PYTHONIOENCODING: utf-8
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
