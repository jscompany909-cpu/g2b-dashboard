name: Daily G2B Collection (검증 기간 ~2026-07-13)

on:
  schedule:
    - cron: '0 0 * * 1-5'  # 평일(월~금) 09:00 KST (UTC 00:00)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  # ── 날짜 체크: 7/13 이후면 스킵 ────────────────────────────────────
  date-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          TODAY=$(date +%Y%m%d)
          DEADLINE=20260713
          if [ "$TODAY" -le "$DEADLINE" ]; then
            echo "should_run=true"  >> $GITHUB_OUTPUT
            echo "오늘: $TODAY — 검증 기간 내 ($DEADLINE 까지)"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "검증 기간 종료 ($DEADLINE 이후) — 실행 건너뜀"
          fi

  collect:
    needs: date-check
    if: needs.date-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    # ── 1. 레포 체크아웃 ──────────────────────────────────────────────
    - name: Checkout g2b-dashboard repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        fetch-depth: 0

    # ── 2. Python 환경 ────────────────────────────────────────────────
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install Playwright Chromium
      run: |
        playwright install chromium
        playwright install-deps chromium

    # ── 3. .env 생성 ──────────────────────────────────────────────────
    - name: Create .env from secrets
      run: |
        cat > .env << 'EOF'
        G2B_API_KEY=${{ secrets.G2B_API_KEY }}
        AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_KEY=${{ secrets.AZURE_OPENAI_KEY }}
        AZURE_OPENAI_DEPLOYMENT=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION }}
        EOF

    # ── 4. 수집 + GPT-4o 채점 + 검증 ─────────────────────────────────
    - name: Run harness
      run: python g2b_harness.py
      env:
        PYTHONIOENCODING: utf-8

    # ── 5. PDF 사업금액 추출 ──────────────────────────────────────────
    - name: Extract PDF budgets
      run: python g2b_pdf_budget.py --no-export
      env:
        PYTHONIOENCODING: utf-8

    # ── 6. JSON export (Redmine 제외) ─────────────────────────────────
    - name: Export JSON
      run: python g2b_export_json.py --ci
      env:
        PYTHONIOENCODING: utf-8

    # ── 7. DB + JSON 커밋 & push ──────────────────────────────────────
    - name: Commit and push results
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add "정부과제_트렌드_창고.db" "data/announcements.json"
        git diff --staged --quiet || git commit -m "chore: 주간 DB 업데이트 $(date '+%Y-%m-%d')"
        git push

    # ── 8. 이메일 발송 ────────────────────────────────────────────────
    - name: Send summary email
      run: python g2b_email_notify.py
      env:
        PYTHONIOENCODING: utf-8
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        NOTIFY_TO: jsbae@innotium.com

    # ── 9. 실패 시 알림 ───────────────────────────────────────────────
    - name: Notify on failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.GMAIL_USER }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: "[G2B 오류] 주간 수집 실패 - ${{ github.run_id }}"
        to: jsbae@innotium.com
        from: ${{ secrets.GMAIL_USER }}
        body: |
          GitHub Actions 주간 G2B 수집이 실패했습니다.

          실행 ID: ${{ github.run_id }}
          로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
